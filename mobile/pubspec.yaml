name: fintrack
description: FinTrack — personal finance tracker with bilingual Spanish/English support.
publish_to: "none"
version: 1.2.1+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  fl_chart: ^1.1.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  freezed: ^3.2.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fintrack_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fintrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fintrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fintrack_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-replace-with-a-secure-secret-that-is-long-enough-123456}
      Jwt__Issuer: ${JWT_ISSUER:-FinTrack}
      Jwt__Audience: ${JWT_AUDIENCE:-FinTrackMobile}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-1440}
      Sso__AllowRegistration: ${SSO_ALLOW_REGISTRATION:-true}
      Sso__RedirectUri: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/auth/sso/callback}
      Sso__AppCallbackUri: ${SSO_APP_CALLBACK_URI:-fintrack://sso/callback}
      Sso__PostLogoutRedirectUri: ${SSO_POST_LOGOUT_REDIRECT_URI:-fintrack://sso/logout}
      Sso__Google__Enabled: ${SSO_GOOGLE_ENABLED:-false}
      Sso__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Sso__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Sso__Microsoft__Enabled: ${SSO_MICROSOFT_ENABLED:-false}
      Sso__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Sso__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      Sso__Microsoft__TenantId: ${MICROSOFT_TENANT_ID:-common}
      Sso__Oidc__Enabled: ${SSO_OIDC_ENABLED:-false}
      Sso__Oidc__ClientId: ${OIDC_CLIENT_ID:-}
      Sso__Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Sso__Oidc__Issuer: ${OIDC_ISSUER_URI:-}
      Sso__Oidc__DisplayName: ${OIDC_DISPLAY_NAME:-Single sign-on}
    ports:
      - "8080:8080"

volumes:
  fintrack_pgdata:
